name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require a matching version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_REF !== `refs/tags/v${version}`) {
            throw new Error(`Run this workflow on tag v${version}; it must match package.json.`);
          }
          JS
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installers
        env:
          ARCH: ${{ matrix.arch }}
          SIGNED: ${{ vars.MAC_SIGNED_RELEASE }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            : "${CSC_LINK:?Missing MAC_CSC_LINK}"
            : "${CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD}"
            : "${APPLE_ID:?Missing APPLE_ID}"
            : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
            : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
            npx electron-builder --mac --"$ARCH" --publish never -c.forceCodeSigning=true -c.mac.notarize=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --"$ARCH" --publish never -c.mac.identity=null -c.mac.notarize=false
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mac-*
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ vars.MAC_SIGNED_RELEASE }}
        shell: bash
        run: |
          cd artifacts
          sha256sum *.dmg *.zip > SHA256SUMS.txt
          if [ "$SIGNED" = "true" ]; then
            echo 'macOS installers for Apple Silicon and Intel. Signed and notarized.' > notes.md
          else
            echo 'Preview build for Apple Silicon and Intel. These installers are unsigned and not notarized; macOS may prevent them from opening normally.' > notes.md
          fi
          if gh release view "$TAG" --json isDraft > existing.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("existing.json")).isDraft) throw Error("Refusing to overwrite a published release")'
          else
            gh release create "$TAG" --verify-tag --draft --title "Kalkidan $TAG" --notes-file notes.md --generate-notes
          fi
          gh release upload "$TAG" *.dmg *.zip SHA256SUMS.txt --clobber
