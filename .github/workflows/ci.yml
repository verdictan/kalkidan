name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ci:ui
      - name: Desktop persistence and IPC
        run: node tests/docs-desktop.mjs
      - name: Remote agent protocol
        run: node tests/io-remote.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
