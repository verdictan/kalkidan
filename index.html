<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:5173; img-src 'self' data:"
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" type="image/svg+xml" href="./brand/favicon.svg" />
    <link rel="alternate icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./brand/icon-180.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>Kalkidan</title>
  </head>
  <body>
    <!--
      The launch splash (SP-C "Name") shows before any script loads. The mark lands in the
      center, then steps left while "Kalkidan" shows beside it. The lockup is 20px above the
      middle of the window. There is no progress bar. The app removes the splash
      (src/lib/splash.ts) when the first page can show: the lockup lifts 6px and fades, or, on
      first run, glides into the heading of the tools check. The colors are the theme values:
      theme.css is not loaded yet.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        color: #171717;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-app-region: drag;
      }
      .splash-bg {
        position: absolute;
        inset: 0;
        background: #ffffff;
        transition: opacity 200ms cubic-bezier(0, 0, 0.2, 1) 40ms;
      }
      /* The browser preview has no window buttons: it draws their place, as the app does. The
         desktop app draws its own buttons, so the place stays hidden there. */
      .splash-lights {
        position: absolute;
        left: 16px;
        top: 14px;
        display: none;
        gap: 8px;
      }
      #splash.splash-preview .splash-lights {
        display: flex;
      }
      .splash-lights i {
        display: block;
        width: 12px;
        height: 12px;
        border-radius: 9999px;
        background: #e5e5e5;
      }
      .splash-lockup {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% - 40px);
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        transform-origin: 0 50%;
        transition:
          opacity 200ms cubic-bezier(0, 0, 0.2, 1),
          transform 200ms cubic-bezier(0, 0, 0.2, 1);
      }
      .splash-mark {
        flex: none;
        width: 40px;
        height: 40px;
        overflow: visible;
        animation: splash-mark 640ms both;
      }
      .splash-point {
        animation: splash-point 280ms both;
      }
      .splash-name {
        font-size: 22px;
        line-height: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        animation: splash-name 760ms both;
      }
      #splash.splash-out .splash-lockup {
        opacity: 0;
        transform: translateY(-6px);
      }
      #splash.splash-out .splash-bg,
      #splash.splash-glide .splash-bg {
        opacity: 0;
      }
      #splash.splash-out,
      #splash.splash-glide {
        pointer-events: none;
      }
      #splash.splash-glide .splash-bg {
        transition-delay: 0ms;
      }
      #splash.splash-glide .splash-lockup {
        justify-content: flex-start;
        transition: transform 320ms cubic-bezier(0.65, 0, 0.35, 1);
      }
      /* Opacity in 0-200 ms, then a 48px step to the left at 200-640 ms. */
      @keyframes splash-mark {
        0% {
          opacity: 0;
          transform: translateX(48px);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
        31.25% {
          opacity: 1;
          transform: translateX(48px);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-point {
        0% {
          opacity: 0;
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
        28.5% {
          opacity: 0;
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
        100% {
          opacity: 1;
        }
      }
      /* The name shows from the left at 320-760 ms. */
      @keyframes splash-name {
        0% {
          opacity: 0;
          clip-path: inset(0 100% 0 0);
          transform: translateX(-12px);
        }
        42.1% {
          opacity: 0;
          clip-path: inset(0 100% 0 0);
          transform: translateX(-12px);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        100% {
          opacity: 1;
          clip-path: inset(0 0 0 0);
          transform: none;
        }
      }
      /* The finished lockup, still. Only a 150 ms cross-fade to the first screen. */
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash {
          animation: none !important;
        }
        .splash-bg,
        .splash-lockup,
        #splash.splash-out .splash-lockup {
          transform: none !important;
          transition: opacity 150ms linear !important;
        }
      }
    </style>
    <div id="splash" aria-hidden="true">
      <div class="splash-bg">
        <span class="splash-lights"><i></i><i></i><i></i></span>
      </div>
      <div class="splash-lockup">
        <svg class="splash-mark" viewBox="0 0 100 100">
          <path
            d="M34 18H20V82H34"
            fill="none"
            stroke="#171717"
            stroke-width="9"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <path
            d="M66 18H80V82H66"
            fill="none"
            stroke="#171717"
            stroke-width="9"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <circle class="splash-point" cx="50" cy="50" r="9" fill="#9a4600" />
        </svg>
        <div class="splash-name">Kalkidan</div>
      </div>
    </div>
    <script src="./splash-preview.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
